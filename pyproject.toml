[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "pgd-libre"
version = "0.1.0"
description = "Plataforma de Gestão e Desempenho — instalação no órgão"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.111.0",
    "strawberry-graphql[fastapi]>=0.230",
    "sqlalchemy[asyncio]>=2.0.31",
    "psycopg[binary]>=3.2.1",
    "pydantic[email]>=2.8.2",
    "pydantic-settings>=2.3",
    "alembic>=1.13",
    "authlib>=1.3",
    "PyJWT>=2.8",
    "httpx>=0.27.0",
    "fastapi-mail>=1.4.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in function signatures

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
