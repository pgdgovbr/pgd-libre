services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pgdlibre
      POSTGRES_PASSWORD: pgdlibre
      POSTGRES_DB: pgdlibre
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgdlibre"]
      interval: 5s
      timeout: 5s
      retries: 5

  smtp:
    image: rnwood/smtp4dev
    ports:
      - "1025:25"
      - "5000:80"  # Web UI para inspecionar e-mails em dev

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Sobrescreve DATABASE_URL do .env para usar o host do compose
      DATABASE_URL: postgresql+psycopg://pgdlibre:pgdlibre@db:5432/pgdlibre
      MAIL_SERVER: smtp
      MAIL_PORT: 25
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app  # hot-reload em dev
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --log-level info

  # Para adicionar Airflow em dev, descomentar e seguir:
  # https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html
  # Em produção usar Cloud Composer (GCP).

volumes:
  postgres_data:
